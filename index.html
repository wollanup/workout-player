<!doctype html>
<html lang="fr" data-mantine-color-scheme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#242424">
  <!-- YouTube embeds need the Referer (origin) header, otherwise error 153 -->
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Workout Player</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg">
  <script>
    // Apply the saved color scheme before first paint (Mantine key), avoids a dark/light flash.
    (function () {
      var v = localStorage.getItem('mantine-color-scheme-value') || 'dark';
      if (v === 'auto') v = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-mantine-color-scheme', v);
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
