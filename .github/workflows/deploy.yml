name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Monthly rebuild: renews the Apple Music developer token (valid 6 months at most).
  schedule:
    - cron: '17 4 1 * *'

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Apple Music developer token (optional)
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_PRIVATE_KEY: ${{ secrets.APPLE_PRIVATE_KEY }}
          APPLE_ORIGINS: https://app.workout.stemux.fr
        run: |
          if [ -z "$APPLE_TEAM_ID" ] || [ -z "$APPLE_KEY_ID" ] || [ -z "$APPLE_PRIVATE_KEY" ]; then
            echo "::notice::Apple Music not configured (secrets APPLE_TEAM_ID / APPLE_KEY_ID / APPLE_PRIVATE_KEY missing): source disabled."
            exit 0
          fi
          echo "VITE_APPLE_MUSIC_TOKEN=$(node scripts/apple-token.mjs)" >> "$GITHUB_ENV"
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
